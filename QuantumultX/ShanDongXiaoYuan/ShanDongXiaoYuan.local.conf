# 闪动校园净化 - Quantumult X 本地配置片段
# 将 ShanDongXiaoYuan.js 放入“iCloud Drive/Quantumult X/Scripts”
# 或“我的 iPhone/Quantumult X/Scripts”，再把下列规则合并到现有配置。
# AI/快手/1rtb/福袋的精准拦截路径参考 fmz200 / 奶思规则：
# https://gist.github.com/wxs0625/5916630f6f8d8499375a8542cb0c7df4

[rewrite_local]

# 按真实响应结构隐藏广告、商业入口、商品推荐位、弹窗和推广任务
^https:\/\/api\.huachenjie\.com\/run-front\/(?:ad\/(?:getAdConfig|getAadPositionAgencyConfig)|common\/getConfig|api\/common\/getCommonConfig|home\/(?:homePage\/config|promoSlots\/config|getAdPopup|sports\/getPopup)|api\/home\/activityEntry|common\/bottom-bar\/redDot|api\/tasks\/available\/list|api\/works\/category\/list|api\/user\/cs\/index)(?:\?|$) url script-response-body ShanDongXiaoYuan.js

# AI 视频入口与第三方广告请求（精准路径，不封业务域名）
^https:\/\/api\.huachenjie\.com\/run-front\/ai\/getAICategory(?:\?|$) url reject-dict
^https?:\/\/ad\.shunchangzhixing\.com\/getAd(?:\?|$) url reject-dict
^https:\/\/open\.e\.kuaishou\.(?:cn|com)\/rest\/e\/v3\/open(?:\/univ)?(?:\?|$) url reject-dict
^https:\/\/(?:zl)?sdk\.1rtb\.net\/sdk\/req_ad(?:\?|$) url reject-dict

[mitm]

hostname = api.huachenjie.com, ad.shunchangzhixing.com, open.e.kuaishou.cn, open.e.kuaishou.com, zlsdk.1rtb.net, sdk.1rtb.net
